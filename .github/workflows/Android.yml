
name: ROCXY Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ROCXY APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ROCXY
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Diagnose Project Structure
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP FILES ==="
          find app -maxdepth 8 -type f
          echo "=== REQUIRED FILES ==="
          for file in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload ROCXY APK
        uses: actions/upload-artifact@v6
        with:
          name: ROCXY-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
